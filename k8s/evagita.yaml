apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: evagita
            - name: POSTGRES_USER
              value: evagita
            - name: POSTGRES_PASSWORD
              value: evagita_dev
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - evagita
                - -d
                - evagita
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evagita-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evagita-backend
  template:
    metadata:
      labels:
        app: evagita-backend
    spec:
      containers:
        - name: evagita-backend
          image: oolonnad/evagita-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/evagita
            - name: SPRING_DATASOURCE_USERNAME
              value: evagita
            - name: SPRING_DATASOURCE_PASSWORD
              value: evagita_dev
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: evagita-backend
spec:
  selector:
    app: evagita-backend
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080