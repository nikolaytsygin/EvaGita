services:
  postgres:
    image: postgres:17
    container_name: evagita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evagita
      POSTGRES_USER: evagita
      POSTGRES_PASSWORD: evagita_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: