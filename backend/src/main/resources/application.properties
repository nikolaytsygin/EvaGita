spring.application.name=EvaGita Backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

security.login.rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
security.login.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
security.login.rate-limit.block-seconds=${LOGIN_RATE_LIMIT_BLOCK_SECONDS:300}
security.login.rate-limit.max-entries=${LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}

smartcaptcha.enabled=${SMARTCAPTCHA_ENABLED:false}
smartcaptcha.client-key=${SMARTCAPTCHA_CLIENT_KEY:}
smartcaptcha.server-key=${SMARTCAPTCHA_SERVER_KEY:}
smartcaptcha.allowed-hosts=${SMARTCAPTCHA_ALLOWED_HOSTS:}
smartcaptcha.email-soft-threshold=${SMARTCAPTCHA_EMAIL_SOFT_THRESHOLD:3}
smartcaptcha.timeout-ms=${SMARTCAPTCHA_TIMEOUT_MS:2000}

server.port=8081
# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:evagita}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:evagita_dev}

# Disable default Spring Security generated user (custom JWT authentication is used)
spring.autoconfigure.exclude=org.springframework.boot.security.UserDetailsServiceAutoConfiguration
