spring.application.name=EvaGita Backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=8081
# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:evagita}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:evagita_dev}

# Disable default Spring Security generated user (custom JWT authentication is used)
spring.autoconfigure.exclude=org.springframework.boot.security.UserDetailsServiceAutoConfiguration
